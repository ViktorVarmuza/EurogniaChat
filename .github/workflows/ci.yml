name: CodeIgniter 4 CI Pipeline


on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest 

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1' 
        extensions: mbstring, intl, json, mysqli, sqlite3
        coverage: none

    
    - name: Prepare Environment File
      run: php -r "file_exists('.env') || copy('env', '.env');"

   
    - name: Install Dependencies
      run: composer install --progress --prefer-dist --no-interaction

    
    - name: Execute Tests
      run: vendor/bin/phpunit